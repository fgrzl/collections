name: CI

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ">=1.23.0"
          cache: true
          cache-dependency-path: "**/go.sum"
          check-latest: false

      - name: Download
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -v -cover
